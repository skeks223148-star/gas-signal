name: 기름값 데이터 갱신

on:
  schedule:
    - cron: "40 15 * * *"        # 매일 00:40 (한국시간) — 전체 수집
    - cron: "10 0,3,7,10 * * *"  # 09:10, 12:10, 16:10, 19:10 — 현재 평균만
    - cron: "25 1 * * 5"         # 금요일 10:25 — 주간 평균
  push:
    branches: [main]
    paths:                       # 사람이 설정·코드를 고치면 바로 다시 계산
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (auto / full / light / weekly)"
        default: auto

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 모드 결정
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "40 15 * * *") echo "mode=full" >> "$GITHUB_OUTPUT" ;;
            "25 1 * * 5")  echo "mode=weekly" >> "$GITHUB_OUTPUT" ;;
            "")            echo "mode=${{ github.event.inputs.mode || 'auto' }}" >> "$GITHUB_OUTPUT" ;;
            *)             echo "mode=light" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 오피넷 수집 · 신호 계산
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        run: python scripts/update.py --mode "${{ steps.mode.outputs.mode }}"

      - name: 결과 저장
        run: |
          git config user.name "gas-signal-bot"
          git config user.email "gas-signal-bot@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "데이터 갱신 ${{ steps.mode.outputs.mode }} $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
